# Load balancer for Tap to Wash (nginx). Sessions live in PostgreSQL, so NO sticky sessions are needed: any copy can serve any request.
upstream tapwash_app {
    least_conn;                                    # send each request to the copy with the fewest active connections
    server app1:3000 max_fails=2 fail_timeout=10s; # a copy that fails twice is skipped for 10 s (passive health check)
    server app2:3000 max_fails=2 fail_timeout=10s;
    server app3:3000 max_fails=2 fail_timeout=10s;
    keepalive 32;                                  # reuse connections to the app
}

server {
    listen 80;
    server_name _;
    client_max_body_size 8m;                       # photo uploads (the app enforces its own limits)

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Behind Cloudflare / a cloud load balancer that already terminates TLS, forward ITS scheme instead of $scheme.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_next_upstream error timeout http_502 http_503 http_504;   # retry another copy if one fails (GET/HEAD only: POSTs are never repeated)
    proxy_next_upstream_tries 2;
    add_header X-Upstream $upstream_addr always;   # which copy answered (handy to see the balancing; remove if you prefer)

    # Live updates (Server-Sent Events): never buffer, keep open for hours.
    # (the app puts a sign-in slot id in front of admin/staff addresses, so the pattern is not anchored at the start)
    location ~ /(live/(catalog|order)|(admin|staff)/api/live)$ {
        proxy_pass http://tapwash_app;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Safaricom's M-Pesa callback: never retried on another copy (a payment must be recorded exactly once).
    location /pay/ {
        proxy_pass http://tapwash_app;
        proxy_next_upstream off;
    }

    location / {
        proxy_pass http://tapwash_app;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
